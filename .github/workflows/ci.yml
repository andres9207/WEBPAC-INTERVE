# Integración continua (DEC-095): en cada push y PR a main y develop valida
# que el servidor pase el lint (DEC-097) y sus tests, y que el cliente pase el
# lint y compile. Cada job publica un resumen con gráficos en la página de la
# ejecución (.github/scripts/ci-summary.mjs, DEC-098).
# Instala con `npm ci` sobre los package-lock.json versionados, igual que el
# servidor de Hostinger (npm install). La versión de Node sale del campo
# "volta" de cada package.json, la misma que en local.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Servidor · lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # `npm ci` corre `prisma generate` (postinstall) y prisma.config.js lee
      # DATABASE_URL. Los tests son unitarios con mocks: nunca se conecta.
      DATABASE_URL: mysql://ci:ci@localhost:3306/ci
      JWT_SECRET: ci-only-not-a-secret
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: server/package.json
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Validar el esquema de Prisma
        run: npx prisma validate

      # Los resultados van en JSON para el resumen (DEC-098). Si el lint falla,
      # se repite en el formato legible para que el log muestre los errores.
      - name: Lint
        run: npm run lint -- -f json -o "$RUNNER_TEMP/eslint-server.json" || { npm run lint -- --quiet; exit 1; }

      - name: Tests
        run: npm test -- --ci --json --outputFile="$RUNNER_TEMP/jest-server.json"

      # También cuando un paso anterior falló: entonces es cuando más sirve.
      - name: Resumen
        if: ${{ !cancelled() }}
        working-directory: .
        run: node .github/scripts/ci-summary.mjs server --jest "$RUNNER_TEMP/jest-server.json" --eslint "$RUNNER_TEMP/eslint-server.json"

  client:
    name: Cliente · lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      # Las de client/.env.production que el build necesita (no son secretos).
      # Las de Firebase y el captcha solo se usan en ejecución.
      VITE_APP_BASE_NAME: interadminpro
      VITE_API_URL: /interadminpro/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/package.json
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint -- -f json -o "$RUNNER_TEMP/eslint-client.json" || { npm run lint -- --quiet; exit 1; }

      - name: Build
        run: npm run build

      - name: Resumen
        if: ${{ !cancelled() }}
        working-directory: .
        run: node .github/scripts/ci-summary.mjs client --eslint "$RUNNER_TEMP/eslint-client.json" --dist client/dist
